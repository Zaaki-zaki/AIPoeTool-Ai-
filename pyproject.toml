[project]
name = "aipoetool"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2",
    "httpx",
    "lupa>=2.8",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
