<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIPoeTool – nakładka</title>
<style>
  :root { --bg: #0c1315; --raise: #172529; --line: #233539; --line2: #2e464b; --text: #dbdfd6; --dim: #8fa1a0; --calc: #5cc2c4; --ok: #7fd36b; --gold: #c8a45c;
          --head: "Bahnschrift", "Segoe UI", sans-serif; --body: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13.5px/1.45 var(--body); display: grid; grid-template-rows: auto auto 1fr auto; border: 1px solid var(--line2); user-select: none; }
  :focus-visible { outline: 2px solid var(--calc); outline-offset: 2px; }
  header { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--raise); border-bottom: 1px solid var(--line); -webkit-app-region: drag; cursor: move; }
  header b { font: 600 14px var(--head); } header span { color: var(--dim); font-size: 12px; }
  .sp { flex: 1; }
  button { background: transparent; color: var(--text); border: 1px solid var(--line2); border-radius: 4px; padding: 4px 10px; font: 500 12.5px var(--body); cursor: pointer; -webkit-app-region: no-drag; }
  button:hover { border-color: var(--calc); } button.primary { background: var(--calc); color: #06191b; border-color: var(--calc); font-weight: 600; }
  #bar { padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--dim); }
  #bar b { color: var(--text); font-weight: 600; } #bar .track { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; } #bar .fill { height: 4px; background: var(--calc); border-radius: 2px; }
  #body { overflow-y: auto; padding: 8px 10px; min-height: 0; }
  .grp { border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; margin-bottom: 7px; }
  .grp.now { border-color: var(--calc); background: #5cc2c414; }
  .grp .t { font: 600 14px var(--head); } .grp .t i { font-style: normal; color: var(--calc); margin-right: 6px; }
  .grp .m { color: var(--dim); font-size: 12px; } .grp .e { margin-top: 3px; font-size: 12.5px; }
  .grp.asc .t i { color: var(--gold); }
  canvas { width: 100%; height: 190px; display: block; background: #0a1012; border-radius: 4px; margin-bottom: 8px; }
  footer { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--raise); }
  .empty { color: var(--dim); padding: 18px 4px; }
  .sup { font-size: 12px; color: var(--dim); margin: 2px 0 8px; } .sup b { color: var(--text); font-weight: 500; }
</style>
</head>
<body>
<header><b id="title">Plan rozwoju</b><span id="sub"></span><span class="sp"></span><button id="x" title="Zamknij nakładkę">✕</button></header>
<div id="bar"></div>
<div id="body"><div class="empty">Wczytuję plan…</div></div>
<footer><button id="back">Cofnij</button><span class="sp"></span><button id="next" class="primary">Wzięte ✓</button></footer>
<script>
const $ = (id) => document.getElementById(id);
let PLAN = null, LAYOUT = null, BYID = null, done = 0, gameLevel = null, groups = [];
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const nodes = (n) => n === 1 ? "1 node" : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 > 20)) ? n + " nody" : n + " nodów";
function makeGroups(steps) {
  const out = [];
  steps.forEach((s, i) => {
    const g = out[out.length - 1];
    if (g && g.target === s.target && g.pool === s.pool) { g.idx.push(i); g.ids.push(s.id); if (s.last) g.last = s; }
    else out.push({ target: s.target, pool: s.pool, idx: [i], ids: [s.id], last: s.last ? s : null, name: s.target_name });
  });
  return out;
}

async function load() {
  try {
    const r = await (await fetch("/api/plan")).json();
    if (!r.plan) { $("body").innerHTML = '<div class="empty">Nie ma jeszcze planu. W głównym oknie poproś o plan rozwoju postaci.</div>'; return; }
    const fresh = !PLAN || PLAN.created !== r.plan.created;
    PLAN = r.plan; done = r.done; gameLevel = r.game_level && r.game_level.level;
    if (fresh) { groups = makeGroups(PLAN.steps); LAYOUT = null; }
    if (!LAYOUT) { const l = await fetch("/api/plan/layout"); if (l.ok) { LAYOUT = await l.json(); BYID = new Map(LAYOUT.nodes.map(n => [n.id, n])); } }
    render();
  } catch (e) { $("body").innerHTML = '<div class="empty">Brak połączenia z aplikacją.</div>'; }
}

function render() {
  const total = PLAN.steps.length;
  $("title").textContent = PLAN.skill;
  $("sub").textContent = PLAN.ascendancy && PLAN.ascendancy !== "None" ? PLAN.ascendancy : PLAN.class;
  const owed = gameLevel ? Math.max(0, gameLevel - 1) : null;            // punkt k = poziom k+1 (bez bonusów z questów)
  const mainDone = PLAN.steps.slice(0, done).filter(s => s.pool === "main").length;
  $("bar").innerHTML = `Poziom w grze: <b>${gameLevel ?? "?"}</b> ${gameLevel ? "" : "(brak Client.txt)"} · wzięte punkty: <b>${mainDone}</b>` +
    (owed !== null ? ` · wg poziomu min. <b>${owed}</b>` : "") + `<div class="track"><div class="fill" style="width:${Math.round(100 * done / total)}%"></div></div>`;
  const cur = groups.findIndex(g => g.idx[g.idx.length - 1] >= done);
  const view = cur < 0 ? [] : groups.slice(cur, cur + 4);
  let html = '<canvas id="cv"></canvas>';
  const est = gameLevel ?? (mainDone + 1), sups = PLAN.supports || [];
  const cs = sups.filter(x => x.level <= est).slice(-1)[0], ns = sups.find(x => x.level > est);
  html += `<div class="sup">Link: <b>${esc(PLAN.skill)}</b>${cs ? " + " + cs.supports.map(esc).join(", ") : ""}` +
    (ns ? `<br>Poz. ${ns.level}: dodaj <b>${esc(ns.supports.filter(x => !(cs ? cs.supports : []).includes(x)).join(", "))}</b>` : "") + `</div>`;
  if (!view.length) html += '<div class="empty">Plan ukończony.</div>';
  view.forEach((g, k) => {
    const l = g.last || {}, lvl = g.pool === "main" ? l.level : l.level;
    html += `<div class="grp ${k === 0 ? "now" : ""} ${g.pool === "asc" ? "asc" : ""}"><div class="t"><i>${g.pool === "asc" ? "Asc" : "Poz. " + (lvl ?? "")}</i>${esc(g.name)}</div>` +
      `<div class="m">${nodes(g.idx.length)}${l.gain_pct ? " · +" + l.gain_pct + "% celu" : ""}</div>` +
      (k === 0 ? (l.effects || []).slice(0, 4).map(e => `<div class="e">${esc(e)}</div>`).join("") : "") + `</div>`;
  });
  $("body").innerHTML = html;
  draw(view[0], cur);
}

function draw(g, cur) {
  const cv = $("cv"); if (!cv || !LAYOUT || !g) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const taken = new Set(PLAN.steps.slice(0, done).map(s => s.id)), now = new Set(g.ids);
  const pts = g.ids.map(id => BYID.get(id)).filter(Boolean);
  if (!pts.length) return;
  let x0 = Math.min(...pts.map(n => n.x)), x1 = Math.max(...pts.map(n => n.x)), y0 = Math.min(...pts.map(n => n.y)), y1 = Math.max(...pts.map(n => n.y));
  const pad = 650, s = Math.min(w / (x1 - x0 + pad * 2), h / (y1 - y0 + pad * 2)), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const X = (x) => (x - cx) * s + w / 2, Y = (y) => (y - cy) * s + h / 2;
  ctx.lineWidth = 1.5; ctx.strokeStyle = "#1f3338"; ctx.beginPath();
  for (const [a, b] of LAYOUT.links) { const A = BYID.get(a), B = BYID.get(b); if (!A || !B) continue; const ax = X(A.x), ay = Y(A.y), bx = X(B.x), by = Y(B.y); if (Math.max(ax, bx) < 0 || Math.min(ax, bx) > w || Math.max(ay, by) < 0 || Math.min(ay, by) > h) continue; ctx.moveTo(ax, ay); ctx.lineTo(bx, by); }
  ctx.stroke();
  for (const [a, b] of LAYOUT.links) { const A = BYID.get(a), B = BYID.get(b); if (!A || !B) continue;
    const ta = taken.has(a) || now.has(a), tb = taken.has(b) || now.has(b); if (!(ta && tb)) continue;
    ctx.strokeStyle = now.has(a) || now.has(b) ? "#7fd36b" : "#c8a45c"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X(A.x), Y(A.y)); ctx.lineTo(X(B.x), Y(B.y)); ctx.stroke(); }
  const R = { N: 5, T: 8, K: 11, M: 6, S: 7, C: 7, A: 7 };
  for (const n of LAYOUT.nodes) { const x = X(n.x), y = Y(n.y); if (x < -10 || y < -10 || x > w + 10 || y > h + 10) continue;
    const st = now.has(n.id) ? "n" : taken.has(n.id) ? "t" : "o"; if (st === "o" && n.t === "N") continue;
    ctx.beginPath(); ctx.arc(x, y, (R[n.t] || 5) * (st === "n" ? 1.25 : 1), 0, 7); ctx.fillStyle = st === "n" ? "#7fd36b" : st === "t" ? "#c8a45c" : "#33464b"; ctx.fill(); }
  ctx.font = "600 12px Segoe UI, sans-serif"; ctx.textBaseline = "middle";
  for (const n of pts) { if (n.t !== "T" && n.t !== "K") continue; const x = X(n.x), y = Y(n.y), tw = ctx.measureText(n.n).width;
    ctx.fillStyle = "#000c"; ctx.fillRect(x + 12, y - 9, tw + 8, 18); ctx.fillStyle = "#9be58a"; ctx.fillText(n.n, x + 16, y); }
}

async function setDone(n) { await fetch("/api/plan/progress", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ done: n }) }); await load(); }
$("next").onclick = () => { const cur = groups.findIndex(g => g.idx[g.idx.length - 1] >= done); if (cur >= 0) setDone(groups[cur].idx[groups[cur].idx.length - 1] + 1); };
$("back").onclick = () => { const cur = groups.findIndex(g => g.idx[g.idx.length - 1] >= done); const prev = (cur < 0 ? groups.length : cur) - 1; if (prev >= 0) setDone(groups[prev].idx[0]); };
$("x").onclick = () => { if (window.pywebview && window.pywebview.api) window.pywebview.api.close(); else window.close(); };
window.addEventListener("resize", () => PLAN && render());
load(); setInterval(load, 4000);
</script>
</body>
</html>
